<style>
/* Layout: title, one big stage, then action chips, the place switcher and the finer settings */
:root {
  --bg: #e8f1ef;
  --stage: #ffe3d3;
  --ink: #1d2826;
  --muted: #5a6d69;
  --line: #c4d6d1;
  --chip: #ffffffe0;
  --on: #1d2826;
  --on-fg: #f2fffb;
  --accent: #12a98a;
  --act: #ffe92e;
  --act-fg: #2b2600;
  --display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1615; --ink: #e4efec; --muted: #93a6a2; --line: #2c3b39; --chip: #1a2422e0;
    --on: #5cf8d6; --on-fg: #0b1513; --accent: #5cf8d6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1615; --ink: #e4efec; --muted: #93a6a2; --line: #2c3b39; --chip: #1a2422e0;
  --on: #5cf8d6; --on-fg: #0b1513; --accent: #5cf8d6;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); overscroll-behavior: none;
  /* on a touch screen: no grey flash on tap, no text selection or callout from a long press */
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.app {
  box-sizing: border-box; height: 100%; height: 100dvh;
  display: grid; grid-template-rows: auto 1fr auto; gap: 12px;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1100px; margin: 0 auto;
}
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
header #tClean { margin-left: auto; align-self: center; }
h1 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; letter-spacing: 0.02em; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
#stage { position: relative; min-height: 220px; border-radius: 22px; overflow: hidden; background: var(--stage); }
#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }
.hint { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: var(--hint, #6b4f45); pointer-events: none; }
#fade { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.17s; }
#status[hidden] { display: none; }
#status { position: absolute; inset: 0; display: grid; place-items: center; color: #6b4f45; font-size: 14px; }
.controls { display: grid; gap: 10px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; min-width: 0; }
.acts, .places { gap: 8px; }
.group { display: flex; align-items: center; gap: 6px; }
.label { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; margin-right: 2px; white-space: nowrap; }
button {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--chip); white-space: nowrap;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer;
  transition: background-color 0.15s, transform 0.15s; touch-action: manipulation;
}
@media (hover: hover) { button:hover { border-color: var(--accent); } }
button:active { transform: scale(0.96); }
button[aria-pressed="true"] { background: var(--on); color: var(--on-fg); border-color: transparent; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.acts button[data-act] { font-size: 15px; padding: 8px 16px; }
.acts button.playing { background: var(--act); color: var(--act-fg); border-color: transparent; }
.acts .sep { flex: 1 1 auto; }
.stat { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* Fingers, not a mouse (an iPad says it's a Mac, so this is set from script): bigger chips, about 44pt tall */
.touch button { font-size: 15px; padding: 10px 16px; min-height: 44px; }
.touch .acts button[data-act] { font-size: 16px; padding: 10px 18px; }
.touch .controls { gap: 12px; }
/* A wide, short screen (an iPad or laptop held landscape): the stage takes the whole height on the left
   and the buttons stack in a column on the right, instead of eating into the stage from below */
@media (orientation: landscape) and (min-width: 960px) and (max-height: 1040px) {
  .app { grid-template: auto 1fr / 1fr minmax(300px, 30%); grid-template-areas: "head head" "stage side"; column-gap: 16px; max-width: none; }
  header { grid-area: head; }
  #stage { grid-area: stage; }
  .controls { grid-area: side; align-content: start; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 4px; }
  .controls .row, .controls .group { flex-wrap: wrap; }
  .acts .sep { display: none; }
  .more { gap: 12px; }
  .more .group { flex-basis: 100%; }
  .controls .label { flex-basis: 100%; margin: 2px 0 -2px; }
  #tAuto { order: -1; }
}
@media (max-width: 600px) {
  h1 { font-size: 24px; }
  .more { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
  .acts .sep { display: none; }
}
/* Recording mode: just the stage, edge to edge, nothing on top of it */
.clean body { background: var(--stage); }
.clean .app { display: block; padding: 0; max-width: none; }
.clean header, .clean .controls, .clean .hint { display: none; }
.clean #stage { position: fixed; inset: 0; border-radius: 0; min-height: 0; }
.clean #c { cursor: none; }
#toast {
  position: absolute; left: 50%; top: max(18px, env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  padding: 8px 16px; border-radius: 999px; background: #1d2826d0; color: #f2fffb; font-size: 14px;
  white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.4s;
}
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { button, #fade, #toast { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>小猫 · Low Poly</h1>
    <p>故意做粗：大块面、像素贴图、顶点抖动。点它一下会有反应</p>
    <button id="tClean" title="只留下画面，用来录屏">⛶ 全屏录屏</button>
  </header>
  <div id="stage">
    <canvas id="c" aria-label="会动的 low poly 小猫三维模型"></canvas>
    <div id="status">模型加载中…</div>
    <div class="hint">点小猫 · 拖动转视角 · 滚轮或双指缩放</div>
    <div id="fade" aria-hidden="true"></div>
    <div id="toast" role="status"></div>
  </div>
  <div class="controls">
    <div class="row acts" role="group" aria-label="动作">
      <button id="aHop" data-act="hop">蹦一下</button>
      <button id="aWave" data-act="wave">打招呼</button>
      <button id="aWalk" data-act="walk">散散步</button>
      <button id="aRun" data-act="run">跑一跑</button>
      <button id="aDance" data-act="dance">跳个舞</button>
      <button id="aSit" data-act="sit">坐一会</button>
      <button id="aSpin" data-act="spin">转圈圈</button>
      <button id="aShake" data-act="shake">摇摇头</button>
      <button id="aGoofy" data-act="goofy">搞怪</button>
      <button id="aStretch" data-act="stretch">伸懒腰</button>
      <button id="aEnjoy" data-act="enjoy">好舒服</button>
      <button id="aDaze" data-act="daze">晕乎乎</button>
      <span class="sep"></span>
      <button id="tAuto" aria-pressed="true">自动表演</button>
    </div>
    <div class="row places" role="group" aria-label="场景">
      <span class="label">场景</span>
      <button data-place="room" aria-pressed="true">房间</button>
      <button data-place="street" aria-pressed="false">街道</button>
      <button data-place="beach" aria-pressed="false">海滩</button>
      <button data-place="snow" aria-pressed="false">雪夜</button>
      <button data-place="island" aria-pressed="false">小岛</button>
    </div>
    <div class="row more">
      <div class="group" role="group" aria-label="视角">
        <span class="label">视角</span>
        <button id="vFront" data-view="front" aria-pressed="false">正面</button>
        <button id="vSide" data-view="side" aria-pressed="false">侧面</button>
        <button id="vBack" data-view="back" aria-pressed="false">背面</button>
        <button id="vThree" data-view="three" aria-pressed="true">3/4</button>
      </div>
      <div class="group" role="group" aria-label="粗糙程度">
        <span class="label">面数</span>
        <button id="d1" data-detail="1" aria-pressed="false">很粗</button>
        <button id="d2" data-detail="2" aria-pressed="true">粗</button>
        <button id="d3" data-detail="3" aria-pressed="false">细一点</button>
        <span class="stat" id="faces"></span>
      </div>
      <div class="group" role="group" aria-label="画面">
        <button id="tPixel" aria-pressed="true">像素感</button>
        <button id="tJitter" aria-pressed="true">顶点抖动</button>
      </div>
    </div>
  </div>
</div>

<script type="module">

const V3 = THREE.Vector3;
// sRGB 0-1 colors for painting textures
const MINT = [0.36, 0.97, 0.84];
const SAND = [0.97, 0.8, 0.71];

const SKY_TOP = new THREE.Color('#9fdde6');
const HORIZON = new THREE.Color('#ffe3d3');

// Front-view drawing pixels -> world units. Head center sits at (427, 362) in the sketch.
const K = 0.00515, HEAD_Y = 1.77;
const W = (px, py) => [(px - 427) * K, HEAD_Y - (py - 362) * K];

const clamp = THREE.MathUtils.clamp;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const gauss = (x, s) => Math.exp(-(x * x) / (s * s));
const smax = (a, b, k) => 0.5 * (a + b + Math.sqrt((a - b) * (a - b) + k * k));
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const hash3 = (x, y, z) => {
  const s = Math.sin(Math.round(x * 1e4) * 0.1271 + Math.round(y * 1e4) * 0.3117 + Math.round(z * 1e4) * 0.0747) * 43758.5453;
  return s - Math.floor(s);
};
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- renderer ----------
const canvas = document.getElementById('c');
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
} catch (e) {
  statusEl.textContent = '这个浏览器打不开 3D 画面，换 Chrome 或 Safari 试试';
  throw e;
}
const scene = new THREE.Scene();
scene.background = HORIZON.clone();
scene.fog = new THREE.Fog(HORIZON, 11, 30);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.85, -0.2);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 3;
controls.maxDistance = 16;
controls.maxPolarAngle = 1.75;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const hemi = new THREE.HemisphereLight(0xffffff, 0xf1c3b0, 1.25);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0de, 1.6);
sun.position.set(3.5, 6, 4.5);
scene.add(sun);
const rim = new THREE.DirectionalLight(0xd9fbff, 1.1);
rim.position.set(-4, 3.5, -5);
scene.add(rim);

// Old-console wobble: snap every vertex to a coarse screen grid.
const snapU = { value: new THREE.Vector2(1e5, 1e5) };
// The ink lines snap to a finer grid: on the coarse one a loop the size of the tail's collapses into a zigzag.
const inkSnapU = { value: new THREE.Vector2(1e5, 1e5) };
function ps1(mat, snap = snapU) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uSnap = snap;
    sh.vertexShader = 'uniform vec2 uSnap;\n' + sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n  gl_Position.xy = floor(gl_Position.xy / gl_Position.w * uSnap + 0.5) / uSnap * gl_Position.w;');
  };
  return mat;
}

// ---------- pixel textures ----------
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
// Fill with a base color, banded into a few shade steps with ordered dithering.
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function pixels(ctx, w, h, colorAt, step = 0.07) {
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const [c, s] = colorAt(x, y);
    const q = Math.round((s + (BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.5) * step) / step) * step;
    const i = (y * w + x) * 4;
    img.data[i] = clamp(c[0] * q * 255, 0, 255);
    img.data[i + 1] = clamp(c[1] * q * 255, 0, 255);
    img.data[i + 2] = clamp(c[2] * q * 255, 0, 255);
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
function strokePts(ctx, pts, width) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.lineWidth = width;
  ctx.strokeStyle = INK_CSS;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

const range = (n, f) => Array.from({ length: n + 1 }, (_, i) => f(i / n));
const line = (a, b, n = 8) => range(n, t => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
const quad = (a, c, b, n = 24) => range(n, t => [
  (1 - t) ** 2 * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0],
  (1 - t) ** 2 * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]]);

// Walls, furniture and buildings that get between the camera and the cat step out of the way, dollhouse style.
// Rays go to five points on her outline. Anything within NEAR of the camera goes too, and so does anything
// standing in front of her in the middle of the picture, so a lamp post or a bed corner never fills the foreground.
const NEAR = 4.5, occRay = new THREE.Ray(), occHit = new V3(), occEnds = [0, 0, 0, 0, 0].map(() => new V3()), occSide = new V3(), occC = new V3();
function cutaway() {
  if (!place?.occ.length || !rig) return;
  const c = rig.root.position;
  camera.updateMatrixWorld();
  const catD = camera.position.distanceTo(c);
  occSide.set(c.z - camera.position.z, 0, camera.position.x - c.x).setLength(1.3);
  occEnds[0].set(c.x, 0.6, c.z); occEnds[1].set(c.x, 2.0, c.z); occEnds[2].set(c.x, 2.7, c.z);
  occEnds[3].set(c.x, 1.8, c.z).add(occSide); occEnds[4].set(c.x, 1.8, c.z).sub(occSide);
  for (const o of place.occ) {
    let hide = o.userData.box.distanceToPoint(camera.position) < NEAR;
    if (!hide) {
      o.userData.box.getCenter(occC);
      if (camera.position.distanceTo(occC) < catD - 1.5) { occC.project(camera); hide = Math.abs(occC.x) < 0.7 && occC.z < 1; }
    }
    if (!hide) for (const e of occEnds) {
      occRay.origin.copy(camera.position);
      occRay.direction.copy(e).sub(camera.position);
      const len = occRay.direction.length();
      occRay.direction.divideScalar(len);
      if (occRay.intersectBox(o.userData.box, occHit) && occHit.distanceTo(camera.position) < len) { hide = true; break; }
    }
    o.visible = !hide;
  }
}

// ---------- character rig ----------
// Every part is modelled in world space, then hung under a pivot node (neck, shoulders, hips, tail root).
function node(parent, origin) {
  const g = new THREE.Group();
  g.userData.o = origin.clone();
  g.position.copy(origin).sub(parent.userData.o);
  parent.add(g);
  return g;
}
function put(n, obj) { obj.position.sub(n.userData.o); n.add(obj); return obj; }

const LEVELS = { 1: { limb: 5, lathe: 6 }, 2: { limb: 6, lathe: 8 }, 3: { limb: 8, lathe: 10 } };
const state = { detail: 2, auto: !reduceMotion, pixel: true, jitter: true, place: 'room' };
let rig = null;

function build(detail) {
  if (rig) {
    scene.remove(rig.root);
    rig.root.traverse(o => o.geometry?.dispose());
  }
  const L = LEVELS[detail], parts = [];
  const part = (n, geo, mat = bodyMat) => { const m = put(n, new THREE.Mesh(geo, mat)); parts.push(m); return m; };

  const root = new THREE.Group(); root.userData.o = new V3();
  const squash = node(root, new V3());
  const body = node(squash, new V3(0, 0.42, 0));
  const head = node(body, new V3(0, 0.86, 0));
  const armL = node(body, new V3(-0.2, 0.68, 0)), armR = node(body, new V3(0.2, 0.68, 0));
  const legL = node(squash, new V3(-0.1, 0.44, 0)), legR = node(squash, new V3(0.1, 0.44, 0));
  const TAIL0 = new V3(0.15, 0.33, -0.1), tail = node(body, TAIL0);

  const { g: hg } = headGeo(detail);
  const headMesh = part(head, hg, headMat);
  const eyes = [];
  for (const d of DECALS) {
    d.mat ??= decalMat(d.tex.open);
    headMesh.add(new THREE.Mesh(decalGeo(hg, d), d.mat));
    if (d.eye) eyes.push(d);
  }
  // side tufts: her side view's "3", traced in drawing pixels and pressed onto the head straight from the side,
  // so it keeps her proportions and an even line instead of stretching round the cheek like a decal.
  // From the point where its two bumps meet, a short stroke runs forward and makes the small flat loop
  // her front view puts on the cheek's outline.
  root.updateMatrixWorld(true);
  const arc = (cx, cy, rx, ry, a0, a1, n) => range(n, t => {
    const a = a0 + (a1 - a0) * t; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)];
  });
  const three = [...arc(1076, 405, 56, 51, -Math.PI / 2 - 0.2, Math.PI / 2, 28), ...arc(1080, 488, 42, 32, -Math.PI / 2, Math.PI / 2 + 0.15, 20).slice(1)];
  const flick = [[1080, 456], [1062, 453], [1046, 450],
    ...range(20, t => { t *= Math.PI * 2; return [1046 - (2 * t - 12 * Math.sin(t)), 450 - 9 * (1 - Math.cos(t))]; })];
  // the head rounds off underneath sooner than her flat drawing does, so the "3" sits a little shorter and higher
  const SQUEEZE = 0.82;
  for (const s of [-1, 1]) {
    const press = pts => pts.map(([px, py]) => {
      rc.set(new V3(3 * s, W(0, 362 + (py - 362) * SQUEEZE)[1], (1020 - px) * K), new V3(-s, 0, 0));
      const hit = rc.intersectObject(headMesh, false)[0];
      return hit && { p: hit.point.clone(), n: hit.face.normal.clone() };
    }).filter(Boolean);
    put(head, strip(press(three), 0.042));
    put(head, strip(press(flick), 0.042));
  }
  // a tongue for pulling faces: hangs just under the middle of her mouth line, hidden until she needs it
  rc.set(new V3(...W(433, 494), 5), new V3(0, 0, -1));
  const lip = rc.intersectObject(headMesh, false)[0];
  const tongue = new THREE.Mesh(tint(facet(lumpy(new THREE.SphereGeometry(0.075, 6, 4), 0.08)), '#ff8fa3', 0.1), tongueMat);
  if (lip) tongue.position.copy(lip.point).addScaledVector(lip.face.normal, 0.03).add(new V3(0, -0.05, 0));
  tongue.scale.set(1.35, 1.6, 0.7); tongue.rotation.x = 0.35; tongue.visible = false;
  put(head, tongue);
  part(body, underHead(torsoGeo(L.lathe)));
  [[legL, -1], [legR, 1]].forEach(([n, s]) => {
    const foot = new V3(0.13 * s, 0.06, 0.06);
    part(n, underHead(ballGeo(foot, 0.07)));
    part(n, underHead(limbGeo(new V3(0.1 * s, 0.44, 0), foot, 0.12, 0.06, L.limb)));
  });
  [[armL, -1], [armR, 1]].forEach(([n, s]) => {
    const tip = new V3(0.39 * s, 0.42, 0.05);
    part(n, underHead(limbGeo(new V3(0.2 * s, 0.68, 0), tip, 0.085, 0.03, L.limb)));
  });
  root.updateMatrixWorld(true);

  // Tail, as in all three of her views: out of the low back corner, a slight sag, then it rises,
  // rolls back over itself into one round loop, crosses its own line and flicks up at the tip.
  // Its heading swings from sideways to backwards along the way, so no single angle looks straight
  // down it, and the loop (standing upright at about 45°) reads as a ring from the front, side and back.
  const P0 = 1.9, P1 = 2.8, LEN = 0.5, k = (P1 - P0) / LEN, up = new V3(0, 1, 0);

  scene.add(root);
  const tris = parts.reduce((n, m) => n + m.geometry.attributes.position.count / 3, 0);

const ACTIONS = {
  hop: {
    dur: 1.1,
    pose(p, t) {
      if (t < 0.18) {                       // crouch
        const e = Math.sin(t / 0.18 * Math.PI / 2);
        p.sy *= 1 - 0.17 * e; p.sxz *= 1 + 0.1 * e; p.aL -= 0.15 * e; p.aR -= 0.15 * e; p.headX += 0.08 * e;
      } else if (t < 0.7) {                 // airborne, stretched
        const k = (t - 0.18) / 0.52, s = Math.sin(k * Math.PI), c = Math.abs(Math.cos(k * Math.PI));
        p.y = 0.7 * s; p.sy *= 1 + 0.1 * c; p.sxz *= 1 - 0.05 * c;
        p.aL += 1.1 * s; p.aR += 1.1 * s; p.lL = p.lR = 0.35 * s; p.headX -= 0.15 * s;
        if (s > 0.4) p.eyes = 'joy';
      } else if (t < 0.88) {                // land, squashed
        const e = Math.sin((t - 0.7) / 0.18 * Math.PI);
        p.sy *= 1 - 0.15 * e; p.sxz *= 1 + 0.09 * e; p.headX += 0.06 * e;
      } else {                              // little rebound
        p.sy *= 1 + 0.02 * Math.sin((t - 0.88) / 0.22 * Math.PI);
      }
    },
  },
  wave: {
    dur: 2.6,
    pose(p, t, u) {
      const e = smooth(0, 0.15, u) * (1 - smooth(0.85, 1, u));
      p.aR += e * (1.25 + 0.4 * Math.sin(t * 11));
      p.bodyZ += 0.04 * e; p.headZ += 0.08 * e;
      if (u > 0.2 && u < 0.8) p.eyes = 'joy';
    },
  },
  walk: {
    dur: 7.5,
    pose(p, t) {
      const D = this.dur, R = 0.8;
      const turnIn = smooth(0, 0.45, t), turnOut = smooth(D - 0.7, D, t);
      const wu = clamp((t - 0.45) / (D - 1.15), 0, 1), phi = Math.PI * 2 * ease(wu);
      p.px = R * Math.sin(phi); p.pz = R * (Math.cos(phi) - 1);
      p.yaw = (Math.PI / 2 + phi) * turnIn - (Math.PI / 2) * turnOut;
      const m = smooth(0, 0.3, t) * (1 - smooth(D - 0.3, D, t)), ph = t * 10;
      p.lL = 0.5 * Math.sin(ph) * m; p.lR = -p.lL;
      p.aLx = -0.45 * Math.sin(ph) * m; p.aRx = -p.aLx;
      p.y += 0.05 * Math.abs(Math.sin(ph)) * m;
      p.bodyX += 0.06 * m; p.bodyZ += 0.05 * Math.sin(ph) * m; p.headZ += 0.04 * Math.sin(ph + 0.5) * m;
      p.tailY = 0.5 * Math.sin(t * 7);
      p.lookW = 1 - m;
    },
  },
  spin: {
    dur: 1.4,
    pose(p, t, u) {
      const k = clamp((u - 0.15) / 0.65, 0, 1), s = Math.sin(Math.PI * k);
      const pre = Math.sin(Math.PI * clamp(u / 0.15, 0, 1)), post = Math.sin(Math.PI * clamp((u - 0.8) / 0.2, 0, 1));
      p.y = 0.55 * s; p.yaw = Math.PI * 2 * ease(k);
      p.sy *= 1 - 0.14 * (pre + post); p.sxz *= 1 + 0.08 * (pre + post);
      p.aL += 1.15 * s; p.aR += 1.15 * s; p.lL = p.lR = 0.25 * s;
      p.eyes = 'joy'; p.lookW = 0;
    },
  },
  shake: {
    dur: 1.3,
    pose(p, t, u) {
      const e = (1 - u) * smooth(0, 0.08, u);
      p.headY += 0.45 * Math.sin(t * 15) * e; p.headZ += 0.05 * Math.sin(t * 15 + 1) * e;
      p.aL += 0.2 * e; p.aR += 0.2 * e;
      p.lookW = 1 - smooth(0, 0.1, u) * (1 - smooth(0.8, 1, u));
    },
  },
  // two laps of her patch at a run: leaning in, arms pumping, the tail streaming out behind
  run: {
    dur: 5.5,
    pose(p, t) {
      const D = this.dur, R = 1.0;
      const turnIn = smooth(0, 0.35, t), turnOut = smooth(D - 0.5, D, t);
      const wu = clamp((t - 0.3) / (D - 0.8), 0, 1), phi = Math.PI * 4 * ease(wu);
      p.px = R * Math.sin(phi); p.pz = R * (Math.cos(phi) - 1);
      p.yaw = (Math.PI / 2 + phi) * turnIn - (Math.PI / 2) * turnOut;
      const m = smooth(0, 0.25, t) * (1 - smooth(D - 0.3, D, t)), ph = t * 17;
      p.lL = 0.85 * Math.sin(ph) * m; p.lR = -p.lL;
      p.aLx = -0.8 * Math.sin(ph) * m; p.aRx = -p.aLx;
      p.aL += 0.25 * m; p.aR += 0.25 * m;
      p.y += 0.13 * Math.abs(Math.sin(ph)) * m;
      p.sy *= 1 - 0.04 * Math.abs(Math.cos(ph)) * m;
      p.bodyX += 0.16 * m; p.headX -= 0.06 * m; p.headZ += 0.05 * Math.sin(ph) * m;
      p.tailY = 0.25 * Math.sin(t * 9); p.tailZ += 0.35 * m;
      if (m > 0.5) p.eyes = 'joy';
      p.lookW = 1 - m;
    },
  },
  // bouncing on the beat, hips swinging, arms taking turns to go up, a spin to finish; notes float up
  dance: {
    dur: 6.4,
    pose(p, t) {
      const D = this.dur, e = smooth(0, 0.3, t) * (1 - smooth(D - 0.4, D, t)), b = t * Math.PI * 2;
      const beat = Math.abs(Math.sin(b)), side = Math.sin(b), up = Math.max(0, side), dn = Math.max(0, -side);
      p.y += 0.12 * beat * e;
      p.sy *= 1 - 0.07 * (1 - beat) * e; p.sxz *= 1 + 0.04 * (1 - beat) * e;
      p.bodyZ += 0.16 * side * e; p.headZ -= 0.14 * side * e; p.headX += 0.06 * Math.cos(2 * b) * e;
      p.aL += (0.4 + 1.8 * up) * e; p.aR += (0.4 + 1.8 * dn) * e;
      p.aLx += 0.3 * Math.sin(2 * b) * e; p.aRx -= 0.3 * Math.sin(2 * b) * e;
      p.lL = -0.35 * up * e; p.lR = -0.35 * dn * e;
      p.tailY = 0.7 * side;
      const fin = smooth(D - 1.6, D - 0.6, t);
      p.yaw = 0.35 * Math.sin(b * 0.5) * e * (1 - fin) + Math.PI * 2 * ease(fin);
      if (e > 0.3) { p.eyes = 'joy'; p.fx = 'note'; }
      p.lookW = 1 - e;
    },
  },
  // sits on the floor, legs out, has a look round, nods off (z's), wakes with a start and gets up
  sit: {
    dur: 7.5,
    pose(p, t) {
      const D = this.dur, down = ease(smooth(0, 0.55, t)) * (1 - ease(smooth(D - 0.6, D, t)));
      p.y -= 0.36 * down;
      p.lL = p.lR = -1.45 * down;
      p.sy *= 1 - 0.04 * down;
      p.bodyX -= 0.06 * down;
      p.aLx = p.aRx = -0.35 * down; p.aL -= 0.05 * down; p.aR -= 0.05 * down;
      p.tailZ += 0.35 * down; p.tailY *= 1 - 0.6 * down;
      const doze = smooth(2.8, 3.4, t) * (1 - smooth(D - 1.5, D - 1.3, t));
      const around = smooth(0.6, 1.0, t) * (1 - smooth(2.6, 3.0, t));
      p.headY += 0.45 * Math.sin((t - 0.6) * 1.6) * around;
      p.headX += doze * (0.14 + 0.1 * Math.max(0, Math.sin(t * 2.2)));
      p.bodyX += 0.05 * doze;
      const jolt = Math.sin(Math.PI * clamp((t - (D - 1.45)) / 0.3, 0, 1));
      p.sy *= 1 + 0.06 * jolt; p.headX -= 0.12 * jolt; p.aL += 0.4 * jolt; p.aR += 0.4 * jolt;
      if (doze > 0.5) { p.eyes = 'content'; p.fx = 'z'; }
      p.lookW = 1 - down;
    },
  },
  // pulling a face: a wink, tongue out, head right over, a hand up by it, little hops side to side
  goofy: {
    dur: 3.2,
    pose(p, t, u) {
      const e = smooth(0, 0.12, u) * (1 - smooth(0.88, 1, u)), w = Math.sin(t * 9);
      p.headZ += (0.32 + 0.05 * w) * e; p.headY += 0.2 * e; p.bodyZ -= 0.12 * e;
      p.aR += (2.2 + 0.25 * Math.sin(t * 14)) * e; p.aL += 0.6 * e;
      p.y += 0.06 * Math.abs(Math.sin(t * 6)) * e; p.px += 0.12 * Math.sin(t * 3) * e;
      p.lL = -0.3 * Math.max(0, Math.sin(t * 6)) * e; p.lR = -0.3 * Math.max(0, -Math.sin(t * 6)) * e;
      p.tailY = 0.8 * w;
      if (e > 0.5) { p.eyeR = 'joy'; p.tongue = true; }
      p.lookW = 1 - e;
    },
  },
  // a cat's stretch: bows forward with her arms reaching out in front, then draws up tall on her toes
  stretch: {
    dur: 3.4,
    pose(p, t, u) {
      const bow = ease(smooth(0.04, 0.25, u)) * (1 - ease(smooth(0.45, 0.6, u)));
      const tall = ease(smooth(0.5, 0.65, u)) * (1 - ease(smooth(0.82, 0.95, u)));
      p.bodyX += 0.45 * bow; p.headX -= 0.4 * bow; p.y -= 0.1 * bow;
      p.aLx -= 1.3 * bow; p.aRx -= 1.3 * bow; p.aL += 0.2 * bow; p.aR += 0.2 * bow;
      p.lL = p.lR = 0.25 * bow;
      p.tailZ += 0.6 * bow;
      p.sy *= 1 + 0.1 * tall; p.sxz *= 1 - 0.05 * tall; p.y += 0.07 * tall;
      p.headX -= 0.15 * tall; p.bodyX -= 0.08 * tall;
      p.aL += (0.9 + 0.05 * Math.sin(t * 30)) * tall; p.aR += (0.9 + 0.05 * Math.sin(t * 30 + 1)) * tall;
      const settle = Math.sin(Math.PI * clamp((u - 0.9) / 0.1, 0, 1));
      p.sy *= 1 - 0.05 * settle; p.sxz *= 1 + 0.03 * settle;
      if (bow + tall > 0.3) p.eyes = 'content';
      p.lookW = 1 - Math.max(bow, tall);
    },
  },
  // at ease: eyes in a U, head tipped back a little, a slow sway, a slow tail
  enjoy: {
    dur: 3.6,
    pose(p, t, u) {
      const e = smooth(0, 0.12, u) * (1 - smooth(0.88, 1, u));
      p.bodyZ += 0.07 * Math.sin(t * 2.2) * e; p.headZ += 0.14 * Math.sin(t * 2.2 - 0.6) * e; p.headX -= 0.12 * e;
      p.sy *= 1 + 0.025 * Math.sin(t * 1.6) * e;
      p.aL -= 0.05 * e; p.aR -= 0.05 * e;
      p.tailY += (0.6 * Math.sin(t * 1.4) - p.tailY) * e;
      if (u > 0.08 && u < 0.92) p.eyes = 'content';
      p.lookW = 1 - e;
    },
  },
  // dreamy: eyes in thin loops with blush, the head rolling round in slow circles, a bit unsteady, arms afloat
  daze: {
    dur: 3.8,
    pose(p, t, u) {
      const e = smooth(0, 0.1, u) * (1 - smooth(0.85, 1, u)), a = t * 3.2;
      p.headZ += 0.16 * Math.sin(a) * e; p.headX += 0.1 * Math.cos(a) * e;
      p.bodyZ -= 0.06 * Math.sin(a - 0.8) * e; p.bodyX += 0.04 * Math.cos(a - 0.8) * e;
      p.px += 0.08 * Math.sin(a * 0.5) * e;
      p.aL += (0.25 + 0.15 * Math.sin(a + 1)) * e; p.aR += (0.25 + 0.15 * Math.sin(a + 2.5)) * e;
      p.lL = 0.08 * Math.sin(a) * e; p.lR = -p.lL;
      p.tailZ -= 0.25 * e;
      if (u > 0.06 && u < 0.92) p.eyes = 'daze';
      p.lookW = 1 - e;
    },
  },
};

// ---------- little ink symbols that float up beside her head: notes while she dances, z's while she dozes ----------
const SYMBOLS = {
  note: () => {
    const g = tube([new V3(0.07, 0.02, 0), new V3(0.07, 0.17, 0), new V3(0.07, 0.32, 0), new V3(0.14, 0.27, 0), new V3(0.17, 0.17, 0)], 0.018);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.065, 6, 4), inkMat);
    dot.scale.set(1.3, 0.9, 0.6); dot.rotation.z = 0.4;
    g.add(dot);
    return g;
  },
  z: () => tube([[-0.1, 0.1], [0.04, 0.1], [0.1, 0.1], [0.04, 0.03], [-0.04, -0.03], [-0.1, -0.1], [-0.04, -0.1], [0.1, -0.1]].map(([x, y]) => new V3(x, y, 0)), 0.02),
};
const floaters = [], fxAt = new V3(), fxSide = new V3();
let lastFx = -Infinity;
function spawnFx(kind, at, t) {
  let f = floaters.find(f => f.kind === kind && !f.g.visible);
  if (!f) { f = { kind, g: SYMBOLS[kind]() }; scene.add(f.g); floaters.push(f); }
  f.g.visible = true; f.t0 = t; f.at = at.clone(); f.side = Math.random() < 0.5 ? -1 : 1;
}
function updateFx(t) {
  fxSide.set(1, 0, 0).applyQuaternion(camera.quaternion);
  for (const f of floaters) {
    if (!f.g.visible) continue;
    const k = (t - f.t0) / 1.8;
    if (k >= 1 || k < 0) { f.g.visible = false; continue; }
    f.g.position.copy(f.at).addScaledVector(fxSide, f.side * (1.35 + 0.3 * k) + 0.08 * Math.sin(k * 9)).add(fxAt.set(0, k * 1.1, 0));
    f.g.quaternion.copy(camera.quaternion);
    f.g.scale.setScalar(1.6 * smooth(0, 0.15, k) * (1 - smooth(0.75, 1, k)));
  }
}

const clock = new THREE.Clock();
let act = null, lastAct = null, idleSince = 0, autoGap = 2.5;
let nextBlink = 1.5, blinkT = -1;
const actButtons = [...document.querySelectorAll('[data-act]')];

function play(name) {
  act = { name, t0: clock.elapsedTime };
  lastAct = name;
  actButtons.forEach(b => b.classList.toggle('playing', b.dataset.act === name));
}
function endAct(t) {
  act = null;
  idleSince = t;
  autoGap = 3 + Math.random() * 3;
  actButtons.forEach(b => b.classList.remove('playing'));
}
function poke() {
  if (act) return;
  play(pick(['hop', 'spin', 'wave', 'shake', 'enjoy', 'daze', 'goofy', 'dance'].filter(n => n !== lastAct)));
}

const look = { x: 0, y: 0, active: false };
const ndc = new THREE.Vector2();
const setNdc = e => {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
};
canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { setNdc(e); look.active = true; } });
canvas.addEventListener('pointerleave', () => { look.active = false; });
let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!downAt || !rig) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if (moved > 6) return;
  setNdc(e);
  rc.setFromCamera(ndc, camera);
  if (rc.intersectObjects(rig.pickables, false).length) poke();
});

const headW = new V3(), lookTarget = new V3();
function animate(t, dt) {
  if (!rig) return;
  const p = { y: 0, sy: 1, sxz: 1, bodyX: 0, bodyZ: 0, headX: 0, headY: 0, headZ: 0, aL: 0, aR: 0, aLx: 0, aRx: 0,
    lL: 0, lR: 0, tailY: 0, tailZ: 0, yaw: 0, px: 0, pz: 0, eyes: null, eyeL: null, eyeR: null, tongue: false, fx: null, lookW: 1 };

  // idle: breathing, a slow head sway, a wagging tail
  const br = Math.sin(t * 2.4);
  p.sy = 1 + 0.02 * br; p.sxz = 1 - 0.01 * br;
  p.headZ = 0.05 * Math.sin(t * 0.9); p.headX = 0.02 * br;
  p.aL = 0.07 * Math.sin(t * 2.4); p.aR = 0.07 * Math.sin(t * 2.4 + 0.7);
  p.tailY = 0.35 * Math.sin(t * 3); p.tailZ = 0.12 * Math.sin(t * 1.6);

  if (act) {
    const A = ACTIONS[act.name], tt = t - act.t0;
    if (tt >= A.dur) endAct(t);
    else A.pose(p, tt, tt / A.dur);
  } else if (state.auto && t - idleSince > autoGap) {
    play(pick(['hop', 'wave', 'walk', 'walk', 'run', 'dance', 'sit', 'spin', 'shake', 'goofy', 'stretch', 'enjoy', 'daze'].filter(n => n !== lastAct)));
  }

  // head follows the mouse; without a mouse it glances around now and then
  let wantYaw = 0.18 * Math.sin(t * 0.4) * Math.sin(t * 0.13), wantPitch = 0;
  if (look.active) {
    rc.setFromCamera(ndc, camera);
    headW.set(p.px, 1.7, p.pz);
    lookTarget.copy(rc.ray.origin).addScaledVector(rc.ray.direction, camera.position.distanceTo(headW) * 0.55).sub(headW);
    const yaw = wrap(Math.atan2(lookTarget.x, lookTarget.z) - p.yaw);
    const pitch = Math.atan2(lookTarget.y, Math.hypot(lookTarget.x, lookTarget.z));
    const w = 1 - smooth(1.0, 1.5, Math.abs(yaw));
    wantYaw = clamp(yaw, -0.7, 0.7) * w;
    wantPitch = clamp(-pitch, -0.35, 0.3) * w;
  }
  const kf = Math.min(1, dt * 5);
  look.x += (wantYaw - look.x) * kf;
  look.y += (wantPitch - look.y) * kf;
  p.headY += look.x * p.lookW; p.headX += look.y * p.lookW;

  if (t > nextBlink) { blinkT = t; nextBlink = t + (Math.random() < 0.2 ? 0.3 : 2 + Math.random() * 3); }
  const blinking = t - blinkT < 0.14;

  rig.root.position.set(p.px, 0, p.pz);
  rig.root.rotation.y = p.yaw;
  rig.squash.position.y = p.y;
  rig.squash.scale.set(p.sxz, p.sy, p.sxz);
  rig.body.rotation.set(p.bodyX, 0, p.bodyZ);
  rig.head.rotation.set(p.headX, p.headY, p.headZ);
  rig.armL.rotation.set(p.aLx, 0, -p.aL);
  rig.armR.rotation.set(p.aRx, 0, p.aR);
  rig.legL.rotation.x = p.lL;
  rig.legR.rotation.x = p.lR;
  rig.tail.rotation.set(0, p.tailY, p.tailZ);
  const face = p.eyes || (blinking ? 'content' : 'open');
  for (const d of rig.eyes) d.mat.map = d.mat.emissiveMap = d.tex[(d.name === 'eyeL' ? p.eyeL : p.eyeR) || face];
  rig.tongue.visible = p.tongue;
  rig.tongue.rotation.z = 0.15 * Math.sin(t * 12);
  if (p.fx && t - lastFx > (p.fx === 'z' ? 0.8 : 0.45)) {
    lastFx = t;
    rig.head.getWorldPosition(fxAt);
    spawnFx(p.fx, fxAt.add(new V3(0, 1.75, 0)), t);   // the neck pivot, up to about ear height
  }
  updateFx(t);

  const s = 1 - clamp(p.y * 0.7, 0, 0.5);
  blob.position.set(p.px, 0.025, p.pz);
  blob.scale.set(s, s, s);
  for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 13) c.position.x = -13; }
  place?.update?.(t, dt);
}

// ---------- camera ----------
const VIEWS = { front: 0, side: Math.PI / 2, back: Math.PI, three: 0.6 };
let camAnim = null;
const baseRadius = () => (camera.aspect < 1 ? 9.6 * Math.min(1.6, 0.95 / camera.aspect) : 9.6);
function placeCamera(theta, phi, r) {
  camera.position.copy(controls.target).add(new V3().setFromSpherical(new THREE.Spherical(r, phi, theta)));
}
function goView(name) {
  const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  let d = VIEWS[name] - sph.theta;
  d = ((d + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  camAnim = { a: { t: sph.theta, p: sph.phi, r: sph.radius }, b: { t: sph.theta + d, p: 1.4, r: baseRadius() }, t0: performance.now() };
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
}

// Pixel mode renders at about 300 lines and lets the browser blow it up without smoothing.
function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  if (!w || !h) return;
  renderer.setPixelRatio(state.pixel ? Math.min(1, 300 / h) : Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  canvas.style.imageRendering = state.pixel ? 'pixelated' : 'auto';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  snapU.value.set(state.jitter ? 90 * camera.aspect : 1e5, state.jitter ? 90 : 1e5);
  inkSnapU.value.copy(snapU.value).multiplyScalar(4);
}
new ResizeObserver(resize).observe(stage);
resize();
placeCamera(VIEWS.three, 1.3, baseRadius());

let frozen = false;
function tick(now) {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (camAnim) {
    const k = reduceMotion ? 1 : Math.min(1, (now - camAnim.t0) / 750), e = ease(k);
    const L = (a, b) => a + (b - a) * e;
    placeCamera(L(camAnim.a.t, camAnim.b.t), L(camAnim.a.p, camAnim.b.p), L(camAnim.a.r, camAnim.b.r));
    if (k === 1) camAnim = null;
  }
  if (!frozen) animate(clock.elapsedTime, dt);
  controls.update();
  cutaway();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// ---------- controls ----------
controls.addEventListener('start', () => {
  camAnim = null;
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', 'false'));
});
actButtons.forEach(b => b.addEventListener('click', () => play(b.dataset.act)));
const toggle = (id, key, after) => {
  const btn = document.getElementById(id);
  btn.setAttribute('aria-pressed', String(state[key]));
  btn.addEventListener('click', () => { state[key] = !state[key]; btn.setAttribute('aria-pressed', String(state[key])); after?.(); });
};
toggle('tAuto', 'auto', () => { idleSince = clock.elapsedTime; });
toggle('tPixel', 'pixel', resize);
toggle('tJitter', 'jitter', resize);
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => goView(b.dataset.view)));
document.querySelectorAll('[data-detail]').forEach(b => b.addEventListener('click', () => {
  state.detail = +b.dataset.detail;
  document.querySelectorAll('[data-detail]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  build(state.detail);
}));

const fade = document.getElementById('fade');
let fading = null;
document.querySelectorAll('[data-place]').forEach(b => b.addEventListener('click', () => {
  const key = b.dataset.place;
  if (key === state.place || fading) return;
  if (reduceMotion) return setPlace(key);
  fade.style.background = PLACES[key].look.bg;
  fade.style.opacity = '1';
  fading = setTimeout(() => { setPlace(key); fading = null; requestAnimationFrame(() => { fade.style.opacity = '0'; }); }, 170);
}));

// ---------- recording mode ----------
// Hides everything but the stage and asks for real fullscreen where the browser allows it (iPad Safari does;
// iPhone Safari doesn't, and a home-screen web app is already chromeless). Leave with a one-second press
// anywhere on the picture, Esc, or the browser's own way out of fullscreen.
const html = document.documentElement, toastEl = document.getElementById('toast');
if (html.classList.contains('touch')) document.querySelector('.hint').textContent = '点小猫 · 拖动转视角 · 双指缩放';
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
let toastTimer = null, wasFull = false;
function toast(text, ms = 2600) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}
function setClean(on) {
  if (on === html.classList.contains('clean')) return;
  html.classList.toggle('clean', on);
  if (on) {
    const req = html.requestFullscreen || html.webkitRequestFullscreen;
    try { req?.call(html)?.catch?.(() => {}); } catch {}
    toast('长按画面 1 秒退出');
  } else {
    toastEl.classList.remove('show');
    if (fsElement()) try { (document.exitFullscreen || document.webkitExitFullscreen).call(document)?.catch?.(() => {}); } catch {}
  }
}
const onFullscreen = () => {
  const full = !!fsElement();
  if (wasFull && !full) setClean(false);
  wasFull = full;
};
document.addEventListener('fullscreenchange', onFullscreen);
document.addEventListener('webkitfullscreenchange', onFullscreen);
document.getElementById('tClean').addEventListener('click', () => setClean(true));
addEventListener('keydown', e => { if (e.key === 'Escape') setClean(false); });
// the long press: one finger held still; a drag, a pinch or letting go early cancels it
const fingers = new Set();
let holdTimer = null, holdAt = null;
const cancelHold = () => { clearTimeout(holdTimer); holdTimer = null; };
canvas.addEventListener('pointerdown', e => {
  fingers.add(e.pointerId);
  cancelHold();
  if (!html.classList.contains('clean') || fingers.size > 1) return;
  holdAt = [e.clientX, e.clientY];
  holdTimer = setTimeout(() => { holdTimer = null; downAt = null; setClean(false); }, 1000);
});
canvas.addEventListener('pointermove', e => {
  if (holdTimer && Math.hypot(e.clientX - holdAt[0], e.clientY - holdAt[1]) > 10) cancelHold();
});
for (const ev of ['pointerup', 'pointercancel']) canvas.addEventListener(ev, e => { fingers.delete(e.pointerId); cancelHold(); });

let saved = null;
try { saved = localStorage.getItem('cat-place'); } catch {}
setPlace(PLACES[saved] ? saved : 'room');
build(state.detail);
statusEl.hidden = true;
window.__cat = {
  goView, play, setClean, setAuto: on => { state.auto = on; }, rig: () => rig, camera, renderer, scene, build, decals: DECALS, setPlace, cutaway, clock,
  tickPlace(t, dt = 0.016) { place?.update?.(t, dt); },
  // freeze the character mid-action, for checking poses frame by frame
  snap(name, tt) { frozen = true; const t = clock.elapsedTime; act = name ? { name, t0: t - tt } : null; animate(t, 0.016); },
  resume() { frozen = false; },
};
requestAnimationFrame(tick);
</script>
</body>
